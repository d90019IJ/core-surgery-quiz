<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>題目預覽｜核心外科講堂</title><link rel="stylesheet" href="./style.css?v=8"></head><body><div class="preview-notice">題目預覽 · 不計分、不儲存、不占用正式考試次數</div><main class="admin-main" style="max-width:850px"><section id="preview-login" class="admin-login"><h1>題目預覽</h1><p>請輸入講師／助教後台的管理碼。</p><form id="preview-login-form"><label for="preview-code">管理碼</label><input id="preview-code" type="password" autocomplete="current-password" required><p id="preview-error" class="error" role="alert"></p><button class="primary" id="preview-login-button">查看題目</button></form></section><section id="preview-content" class="work-panel" hidden style="margin-top:24px;border-radius:18px;background:white"><div class="section-top"><span class="pill">僅供測試</span><button id="preview-logout" class="secondary">結束預覽</button></div><h1 id="preview-title"></h1><p id="preview-mode" class="muted"></p><p>試填不會送出正式考卷。學生正式交卷仍不顯示答案、解析或分數。</p><div class="preview-toolbar"><button type="button" id="preview-reroll" class="primary">重新抽一份試卷</button><button type="button" id="preview-bank" class="secondary">完整題庫審閱（含答案）</button></div><p id="preview-load-error" class="error" role="alert"></p><form id="preview-quiz"><div id="preview-questions"></div><button id="preview-simulate" class="primary" type="submit">模擬交卷</button><button class="secondary" type="reset">重新試填</button><p id="preview-result" role="status"></p></form></section></main><script src="./config.js?v=7"></script><script type="module" src="./preview.js?v=2"></script></body></html>
